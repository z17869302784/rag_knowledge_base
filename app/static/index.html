<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业知识库问答助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px;
        }
        .chat-container {
            background: #ffffff; border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
            width: 750px; height: 88vh; max-height: 900px;
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            text-align: center; padding: 20px; 
            border-bottom: 1px solid #f0f0f0;
            background: #fafafa;
        }
        .chat-header h1 { font-size: 22px; color: #2c3e50; font-weight: 700; }
        .chat-header p { font-size: 13px; color: #888; margin-top: 5px; }

        /* 上传区域样式 */
        .upload-area {
            border: 2px dashed #c0c4cc; border-radius: 12px;
            padding: 15px; text-align: center; margin: 20px 24px 10px;
            transition: all 0.3s ease; cursor: pointer; position: relative;
        }
        .upload-area:hover { border-color: #667eea; background-color: #fdfcff; }
        .upload-area input { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            opacity: 0; cursor: pointer; 
        }
        .upload-text { font-size: 13px; color: #666; }
        .upload-text span { color: #667eea; font-weight: bold; }

        .chat-history {
            flex: 1; overflow-y: auto; margin-bottom: 10px;
            padding: 20px 24px; display: flex; flex-direction: column; gap: 20px;
            background-color: #fcfcfc;
        }
        
        /* 消息基本样式 */
        .message-wrapper { display: flex; align-items: flex-start; gap: 12px; max-width: 85%; }
        .message-wrapper.user { align-self: flex-end; flex-direction: row-reverse; }
        
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .avatar.bot { background: #eef1f8; color: #667eea; }
        .avatar.user { background: #667eea; color: white; }

        .message {
            padding: 14px 20px; border-radius: 16px;
            font-size: 14px; line-height: 1.7; word-wrap: break-word;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .message.user {
            background: linear-gradient(135deg, #667eea, #764ba2); color: white;
            border-bottom-right-radius: 4px;
        }
        .message.bot {
            background-color: #ffffff; color: #333; border: 1px solid #eaeaea;
            border-bottom-left-radius: 4px;
        }
        .message.system {
            align-self: center; background-color: #e6f7ff; color: #1890ff; font-size: 12px;
            border-radius: 20px; padding: 6px 15px; margin: 10px 0;
            box-shadow: none; border: none; max-width: 90%; text-align: center;
        }
        
        /* Markdown 排版优化 */
        .message.bot ul, .message.bot ol { padding-left: 20px; margin: 8px 0; }
        .message.bot li { margin-bottom: 6px; }
        .message.bot p { margin-bottom: 8px; }
        .message.bot p:last-child { margin-bottom: 0; }
        .message.bot strong { color: #667eea; font-weight: 600; }

        .input-area { 
            display: flex; gap: 10px; padding: 15px 24px 20px; 
            background: #ffffff; border-top: 1px solid #f0f0f0;
        }
        input[type="text"] {
            flex: 1; padding: 15px 24px; border: 1px solid #e0e0e0;
            border-radius: 30px; outline: none; font-size: 14px;
            background: #f8f9fa; transition: all 0.3s;
        }
        input[type="text"]:focus { border: 1px solid #667eea; background: #fff; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        button {
            padding: 15px 30px; background: #667eea; color: white;
            border: none; border-radius: 30px; cursor: pointer;
            font-size: 14px; font-weight: bold; transition: background 0.3s;
        }
        button:hover { background: #5a67d8; transform: translateY(-1px); }
        button:disabled { background: #ccc; cursor: not-allowed; transform: none; }

        .chat-history::-webkit-scrollbar { width: 6px; }
        .chat-history::-webkit-scrollbar-thumb { background-color: #ddd; border-radius: 3px; }
        .chat-history::-webkit-scrollbar-track { background-color: transparent; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 企业知识库问答助手</h1>
            <p>上传文档，基于文档内容进行智能问答</p >
        </div>

        <!-- 文档上传区域 -->
        <div class="upload-area">
            <input type="file" id="file-input" accept=".pdf,.docx,.txt,.md">
            <div class="upload-text">点击或拖拽上传文档 (<span>支持 PDF / Word / TXT</span>)</div>
        </div>

        <div class="chat-history" id="chat-history">
            <!-- 默认 AI 欢迎语 -->
            <div class="message-wrapper bot">
                <div class="avatar bot">🤖</div>
                <div class="message bot">你好！我已经准备好了。请先上传你的文档，然后就可以开始提问啦！</div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="基于文档内容，输入你的问题..." autofocus>
            <button id="send-btn" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <!-- 引入 Markdown 排版插件 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        const chatHistory = document.getElementById('chat-history');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const fileInput = document.getElementById('file-input');

        // 1. 处理文件上传
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            appendSystemMessage(`正在上传并解析 "${file.name}"，请稍候...`);
            sendBtn.disabled = true;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const data = await response.json();
                
                if (response.ok) {
                    appendSystemMessage(`✅ 上传成功！文档 "${data.filename}" 已解析为 ${data.chunks_count} 个知识块，现在可以提问了！`);
                } else {
                    appendSystemMessage(`❌ 上传失败：${data.detail}`);
                }
            } catch (error) {
                appendSystemMessage('❌ 哎呀，服务器出错了，请稍后再试。');
            } finally {
                sendBtn.disabled = false;
                fileInput.value = '';
            }
        });

        // 2. 处理发送消息
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // 显示用户发送的消息
            appendMessage('user', message);
            userInput.value = '';
            
            // 禁用按钮防止重复发送
            sendBtn.disabled = true;
            sendBtn.innerText = '思考中...';

            // 添加加载动画提示
            const loadingWrapper = document.createElement('div');
            loadingWrapper.className = 'message-wrapper bot';
            loadingWrapper.innerHTML = `<div class="avatar bot">🤖</div><div class="message bot">正在检索知识库并生成答案...</div>`;
            chatHistory.appendChild(loadingWrapper);
            scrollToBottom();

            try {
                // 调用 /ask 接口
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: message })
                });
                
                // 解析后端返回的 JSON
                const data = await response.json();

                // 移除加载动画
                chatHistory.removeChild(loadingWrapper);

                if (response.ok) {
                    const aiAnswer = data.result || data.answer || '未获取到答案';
                    appendHtmlMessage('bot', aiAnswer); 
                } else {
                    appendMessage('bot', '❌ 系统提示: ' + (data.detail || '未知错误'));
                }

            } catch (error) {
                chatHistory.removeChild(loadingWrapper);
                appendMessage('bot', '❌ 网络连接失败，请检查后端服务是否正常启动。');
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = '发送';
            }
        }

        // 用户消息显示
        function appendMessage(role, text) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${role}`;
            const avatar = role === 'user' ? '<div class="avatar user">😊</div>' : '';
            wrapper.innerHTML = `${avatar}<div class="message ${role}">${text}</div>`;
            chatHistory.appendChild(wrapper);
            scrollToBottom();
        }

        // AI 消息显示（支持 Markdown）
        function appendHtmlMessage(role, markdownText) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${role}`;
            const htmlContent = marked.parse(markdownText);
            wrapper.innerHTML = `<div class="avatar bot">🤖</div><div class="message ${role}">${htmlContent}</div>`;
            chatHistory.appendChild(wrapper);
            scrollToBottom();
        }

        // 系统提示消息（如上传状态）
        function appendSystemMessage(text) {
            const div = document.createElement('div');
            div.className = `message system`;
            div.innerText = text;
            chatHistory.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
